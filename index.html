<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>ROME AGENCY — Quotations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;600&family=IBM+Plex+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f4f4; --layer:#ffffff; --border:#e0e0e0;
    --ink:#161616; --ink2:#525252; --ink3:#6f6f6f; --interactive:#0f62fe;
    --font:'IBM Plex Sans','IBM Plex Sans Thai','Helvetica Neue',Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{font-size:16px}
  body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:.875rem;line-height:1.28572}
  .shell{background:#161616;height:3rem;display:flex;align-items:center;padding:0 1rem}
  .shell .name{color:#fff;font-size:.875rem}
  .shell .name .prefix{font-weight:600;margin-right:.25rem}
  .shell .spacer{flex:1}
  .shell .meta{color:#c6c6c6;font-size:.75rem}
  .wrap{max-width:40rem;margin:0 auto;padding:2.5rem 1rem}
  .label-01{font-size:.75rem;letter-spacing:.32px;color:var(--ink2)}
  h1{font-size:1.75rem;line-height:2.25rem;font-weight:400;margin-top:.375rem;margin-bottom:1.5rem}
  a.card{display:flex;align-items:center;gap:1rem;background:var(--layer);border:1px solid var(--border);padding:1rem;margin-bottom:.5rem;color:var(--ink);text-decoration:none}
  a.card:hover{border-color:var(--ink)}
  .c-main{flex:1}
  .c-title{font-weight:600}
  .c-sub{color:var(--ink3);font-size:.75rem;margin-top:.25rem}
  .c-arrow{color:var(--interactive);font-size:1rem}
  footer{color:var(--ink3);font-size:.75rem;margin-top:2rem}
</style>
</head>
<body>
<header class="shell">
  <div class="name"><span class="prefix">🎖️ ROME AGENCY</span> Quotations</div>
  <div class="spacer"></div>
</header>
<div class="wrap">
  <div class="label-01">CLIENT QUOTATIONS</div>
  <h1>ใบเสนอราคา</h1>
  <a class="card" href="/mg-seo">
    <div class="c-main">
      <div class="c-title">MG Cars — Technical SEO</div>
      <div class="c-sub">www.mgcars.com · 10 รายการจาก SEO Audit · ส.ค. 2026</div>
    </div>
    <span class="c-arrow">→</span>
  </a>
  <a class="card" href="/kkp">
    <div class="c-main">
      <div class="c-title">KKP AUTO — AI Search Optimization (LLMO / GEO)</div>
      <div class="c-sub">Consulting engagement 6 เดือน · ส.ค. 2026</div>
    </div>
    <span class="c-arrow">→</span>
  </a>
  <footer>เอกสารแต่ละฉบับต้องใช้รหัสเข้าชม · ROME AGENCY</footer>
</div>
</body>
</html>
